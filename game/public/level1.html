<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2f67dc">
<title>Rainbow Cascades - Level 1</title>
<link rel="stylesheet" href="css/level1.css">
</head>
<body>
<div id="screen" aria-label="Level 1: Rainbow Cascades">
  <!-- the 3D world: floating islands, the course, the boy (js/level1.bundle.js) -->
  <canvas id="gl"></canvas>
  <div id="fxLayer" aria-hidden="true"></div>

  <div id="hud">
    <button id="btnPause" class="btn" aria-label="Pause"><img src="assets/level1/hud_pause.webp" alt="" draggable="false"></button>
    <div id="pillTime" class="pill"><span id="time" role="timer">00:00</span></div>
    <div id="pillCoins" class="pill"><img src="assets/level1/hud_coin.webp" alt="Coins" draggable="false"><span id="coins">0</span></div>
    <div id="hearts" class="pill" aria-label="Hearts"><i></i><i></i><i></i></div>
    <div id="pillGems" class="pill small"><img src="assets/level1/hud_gem.webp" alt="Gems" draggable="false"><span id="gems">0</span></div>
    <div id="pillTokens" class="pill small"><img src="assets/level1/ring.webp" alt="Tokens" draggable="false"><span id="tokens">0</span></div>

    <div id="seq" class="panel">
      <div id="seqTitle">Follow the Color Sequence!</div>
      <div id="seqRow"><div id="seqOrbs"></div><div id="seqCount">0/7</div></div>
    </div>

    <div id="sectionCard" aria-hidden="true"><div id="sectionNum"></div><div id="sectionTitle"></div></div>

    <div id="banner" class="panel" role="status" aria-live="polite">
      <img id="bannerIcon" alt="" hidden draggable="false">
      <div id="bannerText"><div id="bannerL1"></div><div id="bannerL2"></div></div>
      <img id="bannerIcon2" alt="" hidden draggable="false">
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>

  <!-- Pause -->
  <div id="pause" class="overlay" hidden>
    <div class="menu panel">
      <div class="menuTitle">Paused</div>
      <button class="mbtn" data-cmd="resume">Resume</button>
      <button class="mbtn" data-cmd="restart">Restart</button>
      <button class="mbtn alt" data-cmd="home">Home</button>
    </div>
  </div>

  <!-- Out of hearts -->
  <div id="over" class="overlay" hidden>
    <div class="menu panel">
      <div class="menuTitle">Out of hearts!</div>
      <div class="menuText">Try this section again from its island.</div>
      <button class="mbtn" data-cmd="retry">Try again</button>
      <button class="mbtn alt" data-cmd="home">Home</button>
    </div>
  </div>

  <!-- Level complete (the card from the reference sheet, with live rewards) -->
  <div id="done" class="overlay" hidden>
    <div id="card">
      <img id="cardBg" src="assets/level1/complete_card.webp" alt="" draggable="false">
      <img class="star" id="star1" src="assets/level1/star_1.webp" alt="" draggable="false">
      <img class="star" id="star2" src="assets/level1/star_2.webp" alt="" draggable="false">
      <img class="star" id="star3" src="assets/level1/star_3.webp" alt="" draggable="false">
      <div id="rows"></div>
      <button id="btnNext" class="btn" data-cmd="next" aria-label="Next Level"><img src="assets/level1/btn_next.webp" alt="" draggable="false"></button>
    </div>
    <div id="doneTime"></div>
    <div id="doneLinks">
      <button class="mbtn small" data-cmd="restart">Play again</button>
      <button class="mbtn small alt" data-cmd="home">Home</button>
    </div>
  </div>

  <div id="loading"><div class="spin"></div><div>Loading Level 1…</div></div>
</div>
<script src="js/profile.js"></script>
<script src="js/level1.bundle.js"></script>
</body>
</html>
