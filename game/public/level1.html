<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c4ecd">
<title>Rainbow Cascades - Level 1</title>
<link rel="preload" href="assets/level1/bg_level1.webp" as="image">
<link rel="stylesheet" href="css/level1.css">
</head>
<body>
<div id="screen" aria-label="Rainbow Cascades level 1: Follow the Color Sequence">
  <div id="bgWide" aria-hidden="true"></div>
  <img id="bg" src="assets/level1/bg_level1.webp" alt="" draggable="false">
  <canvas id="world" aria-label="Tap the block with the next colour to jump onto it"></canvas>
  <img id="fgBush" class="el" src="assets/level1/fg_bush.webp" alt="" draggable="false">

  <!-- Top bar -->
  <div id="lvlBand" class="el" aria-hidden="true"></div>
  <img id="avatar" class="el" src="assets/level1/hud_avatar.webp" alt="Player" draggable="false">
  <div id="lvlText" class="el">Lvl <span id="lvl">16</span></div>
  <div id="xp" class="el" role="progressbar" aria-label="Experience"><div id="xpFill"></div><div id="xpGloss"></div></div>
  <div id="timePill" class="el pill"></div>
  <div id="timeText" class="el num" aria-label="Time">00:00</div>
  <img id="watchIcon" class="el" src="assets/level1/hud_stopwatch.webp" alt="" draggable="false">
  <div id="coinPill" class="el pill"></div>
  <div id="coinText" class="el num" aria-label="Coins">0</div>
  <img id="coinIcon" class="el" src="assets/level1/hud_coin.webp" alt="" draggable="false">
  <div id="gemPill" class="el pill"></div>
  <div id="gemText" class="el num" aria-label="Gems">0</div>
  <img id="gemIcon" class="el" src="assets/level1/hud_gem.webp" alt="" draggable="false">
  <button id="pauseBtn" class="el btn" aria-label="Pause"><img src="assets/level1/hud_pause.webp" alt="" draggable="false"></button>

  <!-- Colour sequence -->
  <div id="seqPanel" class="el panel">
    <div id="seqTitle">Follow the Color Sequence!</div>
    <div id="seqCount"><span id="step">1</span>/<span id="steps">7</span></div>
  </div>

  <div id="banner" class="el panel" role="status" aria-live="polite"><span id="bannerText">Jump on the matching colors in order!</span></div>

  <div id="flash" aria-hidden="true"></div>

  <!-- Pause -->
  <div id="pauseMenu" class="overlay" hidden>
    <div class="menu panel">
      <div class="menuTitle">Paused</div>
      <button class="cbtn green" data-cmd="resume">Resume</button>
      <button class="cbtn blue" data-cmd="restart">Restart</button>
      <button class="cbtn blue" data-cmd="home">Home</button>
    </div>
  </div>

  <!-- Level complete -->
  <div id="complete" class="overlay" hidden>
    <div id="card">
      <img class="cardArt" src="assets/level1/card.webp" alt="" draggable="false">
      <div id="stars"></div>
      <div id="rewards" class="panel"></div>
      <img id="btnNext" class="btn" src="assets/level1/btn_next.webp" alt="Next Level" draggable="false" data-cmd="next">
    </div>
    <div id="cardButtons">
      <button class="cbtn blue small" data-cmd="restart">Replay</button>
      <button class="cbtn blue small" data-cmd="home">Home</button>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="js/profile.js"></script>
<script src="js/level1.js"></script>
</body>
</html>
